<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寶島社會大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a "闖關護照" — single centered column; units are passport pages with red ink stamps, games sit on a sea-blue chart ground. */
:root{
  --sea:#e6f1f3; --paper:#ffffff; --ink:#1c3243; --muted:#587082; --line:#c9dde2; --tint:#d6eaee;
  --stamp:#c43d2b; --leaf:#24845a; --sun:#e8a92c;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0d1b24; --paper:#142836; --ink:#e4eef2; --muted:#98b0be; --line:#26404f; --tint:#1b3444;
  --stamp:#ff7b64; --leaf:#5ccb91; --sun:#f3c25a; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0d1b24; --paper:#142836; --ink:#e4eef2; --muted:#98b0be; --line:#26404f; --tint:#1b3444;
  --stamp:#ff7b64; --leaf:#5ccb91; --sun:#f3c25a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:880px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px dashed var(--line);margin-bottom:24px}
.brand{font-family:var(--display);font-size:20px;background:none;border:0;padding:0}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.chip b{color:var(--stamp);font-variant-numeric:tabular-nums}

.hero{display:grid;gap:8px;margin-bottom:28px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted)}
.hero h1{font-family:var(--display);font-size:clamp(34px,7vw,52px);line-height:1.15;font-weight:400}
.hero h1 em{font-style:normal;color:var(--stamp)}
.lede{margin:0;max-width:34em;color:var(--muted)}

.sec{font-family:var(--display);font-weight:400;font-size:20px;margin:28px 0 12px}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.units{grid-template-columns:repeat(2,1fr)}}
.unit{display:grid;justify-items:start;gap:4px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;transition:border-color .15s,transform .15s}
.unit:hover{transform:translateY(-2px)}
.unit.on{border-color:var(--ink)}
.unit .no{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.unit strong{font-size:16px;line-height:1.35}
.stars{color:var(--sun);letter-spacing:2px;font-size:15px}
.stars i{font-style:normal;color:var(--line)}
.stamp{width:62px;height:62px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--muted);margin-bottom:6px;text-align:center;line-height:1.1}
.stamp.got{border:4px double var(--stamp);color:var(--stamp);transform:rotate(-12deg);background:color-mix(in srgb,var(--stamp) 9%,transparent)}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mode{display:grid;gap:4px;text-align:left;background:var(--ink);color:var(--paper);border:0;border-radius:14px;padding:16px 16px 18px}
.mode .big{font-family:var(--display);font-size:22px}
.mode small{opacity:.8;font-size:14px}
.mode.alt{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.mode:hover{filter:brightness(1.08)}
.note{margin-top:28px;font-size:13px;color:var(--muted)}
@media (max-width:440px){.bar{gap:8px}.brand{font-size:18px}.chip{font-size:13px;padding:3px 10px}}

/* play */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:10px;font-size:15px}
.hud .title{font-weight:700;flex:1;min-width:0}
.tab{font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.hearts{color:var(--stamp);letter-spacing:2px}
.hearts i{font-style:normal;color:var(--line)}
.timer{height:8px;background:var(--tint);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer div{height:100%;width:100%;background:var(--leaf);transition:width .1s linear}
.timer div.low{background:var(--stamp)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px)}
.qtag{margin:0 0 6px;font-size:13px;color:var(--muted);letter-spacing:.06em}
.q{font-family:var(--display);font-weight:400;font-size:clamp(21px,4vw,27px);line-height:1.45;margin-bottom:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sea);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:14px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%,var(--paper))}
.opt.right b{background:var(--leaf);color:var(--paper);border-color:var(--leaf)}
.opt.wrong{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 13%,var(--paper))}
.opt.wrong b{background:var(--stamp);color:var(--paper);border-color:var(--stamp)}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;border-left:5px solid var(--leaf);background:var(--tint);display:grid;gap:6px;justify-items:start}
.fb.bad{border-left-color:var(--stamp)}
.fb strong{font-size:17px}
.fb p{margin:0}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 22px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:var(--stamp)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

/* match */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;aspect-ratio:4/3.4;max-width:100%;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--paper);padding:8px;display:grid;place-items:center;text-align:center;font-size:14px;line-height:1.35}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.card .back{font-family:var(--display);font-size:28px;opacity:.55}
.card .face{display:none}
.card.open,.card.done{background:var(--paper);color:var(--ink);animation:pop .25s ease-out}
.card.open .back,.card.done .back{display:none}
.card.open .face,.card.done .face{display:block}
.card .face.t{font-family:var(--display);font-size:17px}
.card.done{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,var(--paper))}
.card.miss{border-color:var(--stamp)}
.card .kind{position:absolute;top:5px;left:8px;font-size:11px;color:var(--muted)}

/* true/false */
.tfcard{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,40px) clamp(18px,4vw,32px);min-height:170px;display:grid;place-items:center;text-align:center;transition:border-color .2s}
.tfcard.ok{border-color:var(--leaf)}
.tfcard.no{border-color:var(--stamp)}
.tfcard p{font-family:var(--display);font-size:clamp(22px,4.4vw,30px);line-height:1.45;margin:0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ox button{border:0;border-radius:16px;padding:14px;display:grid;justify-items:center;gap:2px;color:var(--paper);font-size:15px}
.ox .o{background:var(--leaf)}
.ox .x{background:var(--stamp)}
.ox span{font-family:var(--display);font-size:40px;line-height:1}
.last{margin-top:14px;font-size:14px;color:var(--muted);min-height:3em}
.last b{color:var(--stamp)}

/* result & list */
.res{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,36px);display:grid;gap:14px;justify-items:center;text-align:center}
.res h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px)}
.bigstars{font-size:46px;letter-spacing:6px;color:var(--sun);line-height:1}
.bigstars i{font-style:normal;color:var(--line)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px}
.stats div{display:grid}
.stats b{font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.newstamp{width:110px;height:110px;font-size:22px;animation:thump .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes thump{from{transform:scale(2.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.list{display:grid;gap:10px;margin-top:20px;text-align:left;width:100%}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .u{font-size:12px;color:var(--muted)}
.item p{margin:2px 0}
.item .a{color:var(--leaf);font-weight:700}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <button class="brand" data-act="home">寶島社會大冒險</button>
    <span class="sp"></span>
    <span class="chip">護照集章 <b id="stampCount">0/5</b></span>
    <button class="chip" id="soundBtn" data-act="sound" aria-pressed="true">音效：開</button>
  </header>
  <main id="app"></main>
</div>

<script>
/* ===== 題庫：mc = [題目, 正確答案, [錯誤選項×3], 解說]；tf = [敘述, 對/錯, 解說]；pairs = [名詞, 說明] ===== */
const UNITS = [
{ id:'u1', name:'臺灣的位置與範圍', short:'位置',
  mc:[
   ['臺灣位在哪一個洲的東部邊緣？','亞洲',['歐洲','非洲','大洋洲'],'臺灣位在亞洲大陸的東南方、太平洋的西側。'],
   ['臺灣本島的東邊面臨哪一個海洋？','太平洋',['印度洋','大西洋','北冰洋'],'臺灣東岸直接面對廣大的太平洋。'],
   ['臺灣和中國大陸之間隔著哪一個海峽？','臺灣海峽',['巴士海峽','麻六甲海峽','白令海峽'],'臺灣海峽位在臺灣西邊，澎湖群島就在海峽中。'],
   ['臺灣南邊隔著巴士海峽，和哪一個國家相望？','菲律賓',['日本','韓國','越南'],'巴士海峽位在臺灣和菲律賓之間。'],
   ['北回歸線通過臺灣的哪兩個縣市？','嘉義和花蓮',['臺北和宜蘭','臺中和臺東','高雄和屏東'],'嘉義水上、花蓮瑞穗和豐濱都設有北回歸線標誌。'],
   ['地圖上用來表示南北位置的是什麼？','緯度',['經度','海拔','比例尺'],'緯度表示南北位置，經度表示東西位置。'],
   ['臺灣本島大約位在東經幾度之間？','120～122 度',['100～102 度','130～132 度','140～142 度'],'臺灣本島大約在東經 120 到 122 度之間。'],
   ['下列哪一個島嶼位在臺灣東南方的海上？','蘭嶼',['澎湖','金門','馬祖'],'蘭嶼和綠島都在臺灣東南方的太平洋上。'],
   ['由 90 多座島嶼組成、位在臺灣海峽中的是？','澎湖群島',['蘭嶼','綠島','龜山島'],'澎湖群島由 90 多座大小島嶼組成。'],
   ['金門和馬祖靠近哪裡？','中國大陸東南沿海',['菲律賓北部','日本南部','臺灣東部'],'金門、馬祖離中國大陸很近，離臺灣本島比較遠。'],
   ['地球上 0 度的經線叫做什麼？','本初子午線',['赤道','北回歸線','國際換日線'],'本初子午線通過英國格林威治，是經度的起點。'],
   ['臺灣位在地球的哪兩個半球？','北半球、東半球',['南半球、東半球','北半球、西半球','南半球、西半球'],'臺灣在赤道以北、本初子午線以東。'],
   ['在東亞的島弧上，臺灣大約位在什麼位置？','中間',['最北端','最南端','不在島弧上'],'臺灣北邊有日本、琉球群島，南邊有菲律賓群島，剛好在中間。']
  ],
  tf:[
   ['赤道把地球分成南、北兩個半球。',true,'赤道是 0 度緯線，以北是北半球、以南是南半球。'],
   ['臺灣四面環海，是一座海島。',true,'臺灣四周都被海洋包圍。'],
   ['綠島和蘭嶼位在臺灣西邊的臺灣海峽中。',false,'綠島和蘭嶼在臺灣東南方的太平洋上。'],
   ['緯線是連接南極和北極的線。',false,'連接南北兩極的是經線；緯線和赤道平行。'],
   ['北回歸線以南屬於熱帶。',true,'北回歸線是熱帶和溫帶的分界線。'],
   ['馬祖靠近臺灣本島的東部海岸。',false,'馬祖靠近中國大陸的福建沿海。'],
   ['臺灣位在亞洲大陸的東南方海上。',true,'臺灣在亞洲大陸東南方、太平洋西側。'],
   ['經度可以用來表示東西方向的位置。',true,'經度表示東西位置，緯度表示南北位置。']
  ],
  pairs:[['經線','連接南北兩極的線'],['緯線','和赤道平行的線'],['澎湖群島','臺灣海峽中的群島'],['蘭嶼','東南方海上、達悟族居住的島'],['北回歸線','熱帶和溫帶的分界'],['太平洋','臺灣東邊的大洋'],['巴士海峽','臺灣和菲律賓之間'],['本初子午線','0 度經線']]
},
{ id:'u2', name:'臺灣的地形', short:'地形',
  mc:[
   ['臺灣最高的山峰是哪一座？','玉山',['雪山','合歡山','阿里山'],'玉山主峰約 3952 公尺，是臺灣也是東北亞最高峰。'],
   ['臺灣面積最大的平原是？','嘉南平原',['屏東平原','蘭陽平原','花東縱谷平原'],'嘉南平原是臺灣最大的平原，也是重要的稻米產區。'],
   ['位在宜蘭、形狀像三角形的平原是？','蘭陽平原',['嘉南平原','屏東平原','臺北平原'],'蘭陽平原由蘭陽溪沖積而成，形狀像三角形。'],
   ['四周被山圍繞、中間低平的地形叫做？','盆地',['台地','丘陵','平原'],'臺北盆地、臺中盆地、埔里盆地都是盆地。'],
   ['林口、桃園、八卦山一帶屬於哪一種地形？','台地',['盆地','平原','山地'],'台地頂部平坦，四周有比較陡的斜坡。'],
   ['五大山脈中，位在最東邊、靠近太平洋的是？','海岸山脈',['中央山脈','雪山山脈','阿里山山脈'],'海岸山脈位在花東縱谷的東邊，緊鄰太平洋。'],
   ['縱貫臺灣南北、被稱為「臺灣屋脊」的山脈是？','中央山脈',['海岸山脈','雪山山脈','阿里山山脈'],'中央山脈最長，是臺灣的屋脊，也是許多河川的發源地。'],
   ['花東縱谷位在哪兩座山脈之間？','中央山脈和海岸山脈',['雪山山脈和玉山山脈','阿里山山脈和玉山山脈','雪山山脈和中央山脈'],'花東縱谷是夾在中央山脈和海岸山脈之間的狹長平原。'],
   ['臺灣東部海岸最大的特色是？','山地緊鄰海洋，海岸陡峭',['沙灘寬廣，有很多沙洲','岬角和海灣交錯','有大片珊瑚礁'],'東部海岸山勢直接入海，海岸平直陡峭，稱為斷層海岸。'],
   ['墾丁一帶常見的海岸類型是？','珊瑚礁海岸',['沙岸','岬灣海岸','斷層海岸'],'南部恆春半島沿海有許多珊瑚礁。'],
   ['北部海岸（例如野柳）的特色是？','岬角和海灣交錯',['海岸平直陡峭','有很多潟湖','到處是珊瑚礁'],'北部海岸岩石軟硬不同，形成岬角和海灣交錯的岬灣海岸。'],
   ['臺灣的山地和丘陵大約占全島面積的多少？','約三分之二',['約十分之一','約四分之一','幾乎全部'],'臺灣多山，山地和丘陵約占三分之二。'],
   ['埔里盆地位在哪一個縣？','南投縣',['臺中市','嘉義縣','花蓮縣'],'埔里盆地在南投縣，接近臺灣的地理中心。'],
   ['臺灣整體地勢的特色是？','中央高、四周低',['北部高、南部低','西部高、東部低','到處都一樣平'],'臺灣中央是高山，往四周海岸慢慢降低。']
  ],
  tf:[
   ['西部海岸大多是沙岸，有很多沙洲和潟湖。',true,'西部海岸平直、坡度緩，多沙洲和潟湖。'],
   ['臺灣的高山主要集中在西部沿海。',false,'高山集中在臺灣中部，西部沿海多平原。'],
   ['台地的頂部平坦，四周有陡坡。',true,'這就是台地的特色，例如林口台地。'],
   ['嘉南平原是臺灣最大的平原。',true,'嘉南平原是臺灣面積最大的平原。'],
   ['雪山是臺灣最高的山峰。',false,'最高峰是玉山，雪山排第二。'],

function removeWrong(id) { save.wrong = save.wrong.filter(x => x !== id); }

let ac = null;

  if (!save.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [[660, 0], [880, .09]], bad: [[230, 0], [175, .12]], win: [[523, 0], [659, .11], [784, .22], [1046, .33]], flip: [[520, 0]] }[kind] || [[500, 0]];
    seq.forEach(([f, t]) => {
      const o = ac.createOscillator(), g = ac.createGain(), at = ac.currentTime + t;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.18, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + .2);
      o.connect(g).connect(ac.destination); o.start(at); o.stop(at + .22);
    });
  } catch (e) {}
}

function fromId(id) { const [uid, t, i] = id.split('|'); const u = UNITS.find(x => x.id === uid); if (!u) return null; const arr = t === 'mc' ? u.mc : u.tf; if (!arr[+i]) return null; return t === 'mc' ? mcObj(u, +i) : tfObj(u, +i); }

  <div class="units">${cards}
    <button class="unit ${sel === 'all' ? 'on' : ''}" data-act="sel" data-id="all" aria-pressed="${sel === 'all'}">
      <span class="stamp">全部</span><span class="no">總複習</span><strong>全部單元混合</strong><span class="stars" style="color:var(--muted);letter-spacing:0;font-size:13px">隨機出題</span>
    </button>
  </div>
  <h2 class="sec">2. 選玩法 <span style="font-size:14px;color:var(--muted);font-family:var(--body)">目前：${selName(sel)}</span></h2>
  <div class="modes">
    <button class="mode" data-act="quiz"><span class="big">闖關問答</span><small>10 題選擇題・3 顆愛心・答越快分數越高</small></button>
    <button class="mode" data-act="match"><span class="big">翻牌配對</span><small>翻開 12 張牌，把名詞和說明配成對</small></button>
    <button class="mode" data-act="tf"><span class="big">快問快答</span><small>60 秒是非題，看你能答對幾題</small></button>
    <button class="mode alt" data-act="wrongbook"><span class="big">錯題本</span><small>${save.wrong.length ? `目前有 ${save.wrong.length} 題要再練習` : '答錯的題目會自動收進來'}</small></button>
  </div>
  <p class="note">題目依五年級上學期社會科常見範圍整理（臺灣的位置、地形、氣候水文、史前文化與原住民族、大航海時代與鄭氏時期）。各版本課本的單元名稱和進度不同，請以老師上課內容為準。電腦可用鍵盤 1～4 選答案、Enter 下一題；快問快答用 O／X 鍵。</p>`;
}

/* ===== 闖關問答 ===== */
let Q = null, view = 'home';
function startQuiz(review) {
  let list;
  if (review) {
    list = shuffle(save.wrong).map(fromId).filter(Boolean).slice(0, 20);
    if (!list.length) return wrongbook();
  } else {
    const pool = []; unitsOf(sel).forEach(u => u.mc.forEach((_, i) => pool.push(mcObj(u, i))));
    list = shuffle(pool).slice(0, 10);
  }
  Q = { review, unit: review ? null : sel, title: review ? '錯題重練' : selName(sel), list, idx: 0, hearts: 3, score: 0, combo: 0, bestCombo: 0, correct: 0, misses: [], done: false, t: 25 };
  renderQ();
}
function renderQ() {
  stopTimers(); view = 'quiz';
  const it = Q.list[Q.idx];
  app.innerHTML = `
  <div class="hud">
    <button class="link" data-act="home">← 回首頁</button>
    <span class="title">${Q.title}</span>
    <span class="tab">第 ${Q.idx + 1} / ${Q.list.length} 題</span>
    ${Q.review ? '' : `<span class="hearts" id="hearts" aria-label="剩下 ${Q.hearts} 顆愛心">${'♥'.repeat(Q.hearts)}<i>${'♥'.repeat(3 - Q.hearts)}</i></span>`}
    <span class="tab" id="score">${Q.score} 分</span>
  </div>
  ${Q.review ? '' : '<div class="timer" aria-hidden="true"><div id="tbar"></div></div>'}
  <article class="qcard">
    <p class="qtag">${it.uname}</p>
    <h2 class="q">${it.q}</h2>
    <div class="opts">${it.opts.map((o, k) => `<button class="opt" data-act="ans" data-k="${k}"><b>${'ABCD'[k]}</b><span>${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </article>`;
  Q.done = false; Q.t = 25;
  if (!Q.review) {
    timers.push(setInterval(() => {
      Q.t = Math.max(0, Q.t - .1);
      const bar = $('#tbar'); if (bar) { bar.style.width = (Q.t / 25 * 100) + '%'; bar.classList.toggle('low', Q.t < 7); }
      if (Q.t <= 0) answer(-1);
    }, 100));
  }
}
function answer(k) {
  if (Q.done) return; Q.done = true; stopTimers();
  const it = Q.list[Q.idx], ok = k === it.ans;
  document.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i === it.ans) b.classList.add('right'); else if (i === k) b.classList.add('wrong'); });
  if (ok) {
    Q.correct++; Q.combo++; Q.bestCombo = Math.max(Q.bestCombo, Q.combo);
    Q.score += 100 + (Q.review ? 0 : Math.round(Q.t) * 4) + (Q.combo > 1 ? (Q.combo - 1) * 20 : 0);
    if (Q.review) removeWrong(it.id);
    beep('ok');
  } else {
    Q.combo = 0; if (!Q.review) Q.hearts--; Q.misses.push(it); addWrong(it.id); beep('bad');
  }
  persist();
  const end = Q.idx + 1 >= Q.list.length || Q.hearts <= 0;
  const head = ok ? (Q.combo > 1 ? `答對了！連續答對 ${Q.combo} 題` : '答對了！') : (k < 0 ? '時間到！' : '差一點！');
  $('#fb').innerHTML = `<div class="fb ${ok ? '' : 'bad'}" role="status"><strong>${head}</strong>${ok ? '' : `<p>正確答案是「${it.opts[it.ans]}」。</p>`}<p>${it.exp}</p><button class="btn" data-act="next" id="nextBtn">${end ? (Q.hearts <= 0 ? '愛心用完了，看結果' : '看結果') : '下一題'} →</button></div>`;
  const s = $('#score'); if (s) s.textContent = Q.score + ' 分';
  const h = $('#hearts'); if (h) h.innerHTML = '♥'.repeat(Q.hearts) + '<i>' + '♥'.repeat(3 - Q.hearts) + '</i>';
  $('#nextBtn').focus({ preventScroll: true });
}
function nextQ() {
  Q.idx++;
  if (Q.idx >= Q.list.length || Q.hearts <= 0) return quizResult();
  renderQ();
}
function quizResult() {
  const rate = Q.correct / Q.list.length;
  const stars = rate >= .9 ? 3 : rate >= .7 ? 2 : rate >= .5 ? 1 : 0;
  let newStamp = null;
  if (!Q.review && Q.unit !== 'all') {
    save.best[Q.unit] = Math.max(save.best[Q.unit] || 0, stars);
    if (stars >= 2 && !save.stamps[Q.unit]) { save.stamps[Q.unit] = true; newStamp = UNITS.find(u => u.id === Q.unit); }
    persist();
  }
  const msg = stars === 3 ? '太厲害了，完全掌握！' : stars === 2 ? '很不錯，再複習一下錯題就更穩了！' : stars === 1 ? '有進步空間，看看下面的解說再挑戰一次！' : '先別灰心，從錯題本開始慢慢練！';
  showResult({
    title: Q.review ? '錯題重練完成' : Q.hearts <= 0 ? '愛心用完了' : '闖關完成', stars, msg, newStamp,
    stats: [['答對', `${Q.correct}/${Q.list.length}`], ['分數', Q.score], ['最高連對', Q.bestCombo]],
    misses: Q.misses.map(it => ({ u: it.uname, q: it.q, a: it.opts[it.ans], exp: it.exp })),
    again: Q.review ? 'review' : 'quiz'
  });
}

/* ===== 翻牌配對 ===== */
let M = null;
function startMatch() {
  stopTimers(); view = 'match';
  const pool = []; unitsOf(sel).forEach(u => u.pairs.forEach(p => pool.push({ t: p[0], d: p[1], u: u.name })));
  const pick = shuffle(pool).slice(0, 6);
  const cards = shuffle(pick.flatMap((p, k) => [{ k, side: 't', text: p.t }, { k, side: 'd', text: p.d }]));
  M = { cards, open: [], moves: 0, found: 0, pairs: pick.length, start: Date.now(), lock: false };
  app.innerHTML = `
  <div class="hud">
    <button class="link" data-act="home">← 回首頁</button>
    <span class="title">翻牌配對・${selName(sel)}</span>
    <span class="tab" id="mPairs">配對 0/${M.pairs}</span>
    <span class="tab" id="mMoves">翻了 0 次</span>
    <span class="tab" id="mTime">0 秒</span>
  </div>
  <p style="margin:0 0 12px;color:var(--muted);font-size:14px">每次翻兩張，把「名詞」和它的「說明」配成一對。</p>
  <div class="grid">${cards.map((c, n) => `<button class="card" data-act="flip" data-n="${n}" aria-label="第 ${n + 1} 張牌"><span class="back">?</span><span class="kind" hidden>${c.side === 't' ? '名詞' : '說明'}</span><span class="face ${c.side}">${c.text}</span></button>`).join('')}</div>`;
  timers.push(setInterval(() => { const el = $('#mTime'); if (el) el.textContent = Math.round((Date.now() - M.start) / 1000) + ' 秒'; }, 500));
}
function flip(n) {
  if (M.lock) return;
  const c = M.cards[n], el = document.querySelector(`.card[data-n="${n}"]`);
  if (c.done || M.open.includes(n)) return;
  M.open.push(n); el.classList.add('open'); el.querySelector('.kind').hidden = false; el.setAttribute('aria-label', c.text); beep('flip');
  if (M.open.length < 2) return;
  M.moves++; $('#mMoves').textContent = `翻了 ${M.moves} 次`;
  const [a, b] = M.open.map(i => M.cards[i]);
  const els = M.open.map(i => document.querySelector(`.card[data-n="${i}"]`));
  if (a.k === b.k && a.side !== b.side) {
    a.done = b.done = true; els.forEach(e => { e.classList.remove('open'); e.classList.add('done'); e.disabled = true; });
    M.open = []; M.found++; $('#mPairs').textContent = `配對 ${M.found}/${M.pairs}`; beep('ok');
    if (M.found === M.pairs) timers.push(setTimeout(matchResult, 600));
  } else {
    M.lock = true; els.forEach(e => e.classList.add('miss')); beep('bad');
    timers.push(setTimeout(() => {
      els.forEach(e => { e.classList.remove('open', 'miss'); e.querySelector('.kind').hidden = true; });
      M.open = []; M.lock = false;
    }, 950));
  }
}
function matchResult() {
  const secs = Math.round((Date.now() - M.start) / 1000);
  const stars = M.moves <= M.pairs + 3 ? 3 : M.moves <= M.pairs + 7 ? 2 : 1;
  const pairs = []; const seen = new Set();
  M.cards.forEach(c => { if (!seen.has(c.k)) { seen.add(c.k); const t = M.cards.find(x => x.k === c.k && x.side === 't'), d = M.cards.find(x => x.k === c.k && x.side === 'd'); pairs.push({ u: '', q: t.text, a: d.text, exp: '' }); } });
  showResult({ title: '全部配對完成', stars, msg: stars === 3 ? '記憶力超強！' : '再玩一次，試試用更少次數完成！', stats: [['翻牌次數', M.moves], ['花費時間', secs + ' 秒']], misses: pairs, listTitle: '這次配對的名詞', again: 'match' });
}

/* ===== 快問快答（是非題） ===== */
let T = null;
function startTF() {
  stopTimers(); view = 'tf';
  const pool = []; unitsOf(sel).forEach(u => u.tf.forEach((_, i) => pool.push(tfObj(u, i))));
  T = { base: pool, deck: shuffle(pool), i: 0, left: 60, correct: 0, total: 0, combo: 0, bestCombo: 0, misses: [], over: false };
  app.innerHTML = `
  <div class="hud">
    <button class="link" data-act="home">← 回首頁</button>
    <span class="title">快問快答・${selName(sel)}</span>
    <span class="tab" id="tLeft">剩 60 秒</span>
    <span class="tab" id="tScore">答對 0 題</span>
  </div>
  <div class="timer" aria-hidden="true"><div id="tbar"></div></div>
  <div class="tfcard" id="tfcard"><p id="tfq"></p></div>
  <div class="ox">
    <button class="o" data-act="tfa" data-v="1"><span>O</span>對（O 鍵）</button>
    <button class="x" data-act="tfa" data-v="0"><span>X</span>錯（X 鍵）</button>
  </div>
  <p class="last" id="tfLast" aria-live="polite">看到敘述就快速判斷對或錯！</p>`;
  showTF();
  timers.push(setInterval(() => {
    T.left = Math.max(0, T.left - .1);
    $('#tbar').style.width = (T.left / 60 * 100) + '%'; $('#tbar').classList.toggle('low', T.left < 10);
    $('#tLeft').textContent = `剩 ${Math.ceil(T.left)} 秒`;
    if (T.left <= 0) tfEnd();
  }, 100));
}
function showTF() { if (T.i >= T.deck.length) { T.deck = shuffle(T.base); T.i = 0; } $('#tfq').textContent = T.deck[T.i].s; }
function tfAnswer(v) {
  if (T.over) return;
  const it = T.deck[T.i], ok = v === it.b; T.total++;
  const card = $('#tfcard'); card.classList.remove('ok', 'no'); void card.offsetWidth; card.classList.add(ok ? 'ok' : 'no');
  if (ok) { T.correct++; T.combo++; T.bestCombo = Math.max(T.bestCombo, T.combo); beep('ok'); $('#tfLast').innerHTML = T.combo > 2 ? `連續答對 ${T.combo} 題！` : '答對了！'; }
  else { T.combo = 0; if (!T.misses.find(m => m.id === it.id)) T.misses.push(it); addWrong(it.id); persist(); beep('bad'); $('#tfLast').innerHTML = `<b>剛剛那題應該是「${it.b ? '對' : '錯'}」</b>：${it.exp}`; }
  $('#tScore').textContent = `答對 ${T.correct} 題`;
  T.i++; showTF();
}
function tfEnd() {
  T.over = true; stopTimers();
  const stars = T.correct >= 14 ? 3 : T.correct >= 9 ? 2 : T.correct >= 4 ? 1 : 0;
  showResult({ title: '時間到！', stars, msg: stars >= 2 ? '反應又快又準！' : '多玩幾次，速度會越來越快！', stats: [['答對', T.correct], ['作答', T.total], ['最高連對', T.bestCombo]], misses: T.misses.map(it => ({ u: it.uname, q: it.s, a: it.b ? '對' : '錯', exp: it.exp })), again: 'tf' });
}

/* ===== 結果 ===== */
function showResult(r) {
  stopTimers(); view = 'result';
  if (r.stars >= 2) beep('win');
  const lt = r.listTitle || '答錯的題目（已收進錯題本）';
  app.innerHTML = `
  <section class="res">
    ${r.newStamp ? `<span class="stamp got newstamp">${r.newStamp.short}<br>過關</span><p style="margin:0;color:var(--stamp);font-weight:700">護照蓋章成功：${r.newStamp.name}</p>` : ''}
    <h2>${r.title}</h2>
    <div class="bigstars" aria-label="${r.stars} 顆星">${starStr(r.stars)}</div>
    <p style="margin:0">${r.msg}</p>
    <div class="stats">${r.stats.map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
    <div class="row" style="justify-content:center">
      <button class="btn" data-act="again" data-mode="${r.again}">再玩一次</button>
      <button class="btn ghost" data-act="home">回首頁</button>
    </div>
  </section>
  ${r.misses.length ? `<h2 class="sec">${lt}</h2><div class="list">${r.misses.map(m => `<div class="item">${m.u ? `<span class="u">${m.u}</span>` : ''}<p>${m.q}</p><p class="a">${r.listTitle ? '→ ' : '答案：'}${m.a}</p>${m.exp ? `<p style="color:var(--muted);font-size:14px">${m.exp}</p>` : ''}</div>`).join('')}</div>` : ''}`;
  window.scrollTo({ top: 0 });
}

/* ===== 錯題本 ===== */
let clearArmed = false;
function wrongbook() {
  stopTimers(); view = 'wrong'; clearArmed = false;
  const items = save.wrong.map(fromId).filter(Boolean);
  app.innerHTML = `
  <div class="hud"><button class="link" data-act="home">← 回首頁</button><span class="title">錯題本</span><span class="tab">${items.length} 題</span></div>
  ${items.length ? `
    <p style="margin:0 0 12px;color:var(--muted)">重練時答對的題目會自動從錯題本移除。</p>
    <div class="row"><button class="btn" data-act="review">重練這些題目</button><button class="btn ghost" data-act="clear" id="clearBtn">清空錯題本</button></div>
    <div class="list">${items.map(it => `<div class="item"><span class="u">${it.uname}</span><p>${it.q}</p><p class="a">答案：${it.opts[it.ans]}</p><p style="color:var(--muted);font-size:14px">${it.exp}</p></div>`).join('')}</div>`
    : `<div class="empty">錯題本目前是空的。去玩「闖關問答」或「快問快答」，答錯的題目會自動收進來。</div>`}`;
}

/* ===== 事件 ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'home') home();
  else if (a === 'sel') { sel = b.dataset.id; home(); }
  else if (a === 'quiz') startQuiz(false);
  else if (a === 'match') startMatch();
  else if (a === 'tf') startTF();
  else if (a === 'wrongbook') wrongbook();
  else if (a === 'review') startQuiz(true);
  else if (a === 'ans') answer(+b.dataset.k);
  else if (a === 'next') nextQ();
  else if (a === 'flip') flip(+b.dataset.n);
  else if (a === 'tfa') tfAnswer(b.dataset.v === '1');
  else if (a === 'again') ({ quiz: () => startQuiz(false), review: () => startQuiz(true), match: startMatch, tf: startTF })[b.dataset.mode]();
  else if (a === 'sound') { save.sound = !save.sound; persist(); beep('ok'); }
  else if (a === 'clear') {
    if (!clearArmed) { clearArmed = true; b.textContent = '再按一次確認清空'; b.classList.add('danger'); }
    else { save.wrong = []; persist(); wrongbook(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (view === 'quiz') {
    if (!Q.done) { const m = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[k]; if (m !== undefined && m < Q.list[Q.idx].opts.length) answer(m); }
    else if (k === 'enter' && document.activeElement?.id !== 'nextBtn') nextQ();
  } else if (view === 'tf') {
    if (k === 'o' || k === 'arrowleft') tfAnswer(true);
    else if (k === 'x' || k === 'arrowright') tfAnswer(false);
  }
});

updateBar();
home();
</script>
</body>
</html>
